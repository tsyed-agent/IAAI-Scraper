# IAAI Ontario API + MCP — binds to localhost only by default.
# Copy .env.example to .env and set IAAI_API_TOKEN before starting.
services:
  iaai-api:
    build: .
    image: iaai-scraper:latest
    container_name: iaai-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IAAI_API_PORT:-8000}:8000"
    environment:
      IAAI_API_TOKEN: ${IAAI_API_TOKEN:?set IAAI_API_TOKEN in .env}
      IAAI_REQUIRE_AUTH: "true"
      IAAI_DATA_DIR: /data
      IAAI_DB_PATH: /data/iaai_ontario.db
      IAAI_HEADLESS: "true"
      HOME: /data
    volumes:
      - iaai-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777

  iaai-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: iaai-mcp:latest
    container_name: iaai-mcp
    restart: unless-stopped
    depends_on:
      - iaai-api
    ports:
      - "127.0.0.1:${IAAI_MCP_PORT:-8080}:8080"
    environment:
      IAAI_API_TOKEN: ${IAAI_API_TOKEN:?set IAAI_API_TOKEN in .env}
      IAAI_API_BASE_URL: http://iaai-api:8000
      IAAI_MCP_TRANSPORT: streamable-http
      IAAI_MCP_HOST: 0.0.0.0
      IAAI_MCP_PORT: 8080
      IAAI_DOCKER_WAKE: "false"
      IAAI_MCP_MAX_CONCURRENT: "32"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  iaai-data:
