# IAAI Ontario API — binds to localhost only by default.
# Copy .env.example to .env and set IAAI_API_TOKEN before starting.
services:
  iaai-api:
    build: .
    image: iaai-scraper:latest
    container_name: iaai-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IAAI_API_PORT:-8000}:8000"
    environment:
      IAAI_API_TOKEN: ${IAAI_API_TOKEN:?set IAAI_API_TOKEN in .env}
      IAAI_COMMAND_TOKEN: ${IAAI_COMMAND_TOKEN:-}
      IAAI_REQUIRE_AUTH: "true"
      IAAI_MAX_DATA_AGE_HOURS: ${IAAI_MAX_DATA_AGE_HOURS:-24}
      IAAI_DATA_DIR: /data
      IAAI_DB_PATH: /data/iaai_ontario.db
      IAAI_HEADLESS: "true"
      HOME: /data
    volumes:
      - iaai-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    # No extra ports, no host network — only published 8000/tcp on loopback.

volumes:
  iaai-data:
